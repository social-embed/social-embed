name: tests

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["22.x", "24.x", "26.x"]

    steps:
      - name: Disable AppArmor
        # Disable AppArmor's restricted user namespaces on Ubuntu 23.10+ so chrome sandboxes work
        # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
        shell: bash
      - uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # setup-bun caches only the bun executable, not the dependency cache.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: project - install
        run: bun install --frozen-lockfile

      - name: "playwright: Install browsers"
        run: bunx playwright install --with-deps
        working-directory: packages/wc

      - name: biome format .
        run: bunx biome format .

      - name: biome lint .
        run: bunx biome lint .

      - name: biome check .
        run: bunx biome check .

      - name: build
        run: bun run build

      - name: test
        run: bun run test
