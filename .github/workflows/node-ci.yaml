name: tests

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["22.x", "24.x", "26.x"]

    steps:
      - name: Disable AppArmor
        # Disable AppArmor's restricted user namespaces on Ubuntu 23.10+ so chrome sandboxes work
        # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
        shell: bash
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: "pnpm"

      - name: project - install
        run: pnpm install --frozen-lockfile

      - name: "playwright: Install browsers"
        run: pnpm --filter @social-embed/wc exec playwright install --with-deps

      # Generates .astro/types.d.ts for the site type-check.
      - name: Astro sync
        run: pnpm --filter @social-embed/site exec astro sync

      # oxfmt formats everything except .astro; Biome formats .astro frontmatter.
      - name: Format check (oxfmt, biome)
        run: pnpm run format:check

      # Exits 1 on any error: .oxlintrc.json sets categories.correctness = "error".
      - name: Lint (oxlint)
        run: pnpm run lint

      # oxlint does not lint CSS, so stylelint covers it.
      - name: Lint (stylelint, CSS)
        run: pnpm run lint:css

      # Type-aware rules (tsgolint) need the project's types, so no build first.
      - name: Lint (oxlint, type-aware)
        run: pnpm run lint:type-aware

      - name: build
        run: pnpm build

      - name: test
        run: pnpm test
