name: Deploy Site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: site

    steps:
      - uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      # setup-bun caches only the bun executable, not the dependency cache.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: |
          bun run build
          bun run --filter @social-embed/site --elide-lines=0 build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.SOCIAL_EMBED_SITE_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: |
          aws s3 sync packages/site/dist "s3://${{ secrets.SOCIAL_EMBED_SITE_BUCKET }}" \
            --delete \
            --cache-control "public,max-age=3600"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.SOCIAL_EMBED_SITE_DISTRIBUTION }}" \
            --paths "/*"
