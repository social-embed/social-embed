packages:
  - packages/*
nodeLinker: hoisted
verifyDepsBeforeRun: false
# Supply-chain cooldown: ignore versions younger than 3 days (4320 minutes).
# pnpm's key/unit differ from npm's: pnpm reads `minimumReleaseAge` in minutes,
# npm reads `min-release-age` in days (~/.npmrc). pnpm ignores the npm key, so
# this must be set here to actually take effect. pnpm 11 defaults this to 1 day.
minimumReleaseAge: 4320
# Strict: a release younger than the cooldown stops install, add and update
# with ERR_PNPM_NO_MATURE_MATCHING_VERSION when run from CI or a script; an
# interactive terminal lists every young pick in one prompt, and only "y"
# writes them to `minimumReleaseAgeExclude`. Loose mode (false) wrote those
# entries without asking.
minimumReleaseAgeStrict: true
allowBuilds:
  esbuild: true
  sharp: true
# Pin @codemirror/view to a single version. The cooldown above otherwise lets
# pnpm re-split it (site's direct ^6.43.0 vs transitive 6.42.1), which breaks
# CodeMirror syntax highlighting: two `EditorView.decorations` facet identities
# mean highlight decorations register against a facet the live view never reads.
overrides:
  "@codemirror/view": "^6.43.11"
# @napi-rs/wasm-runtime peers `@emnapi/runtime ^1.7.1 || 2.0.0-beta.2`, and with
# Astro 7.4.11 pnpm resolves the beta. The beta throws `this.bridge.setLastError
# is not a function` in @astrojs/astro2tsx, so `astro check` crashes. Drop this
# once @napi-rs/wasm-runtime no longer admits the 2.0 beta or `astro check` runs
# on @emnapi/runtime 2.x.
  "@emnapi/runtime": 1.11.3
